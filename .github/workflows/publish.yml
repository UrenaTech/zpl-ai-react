name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - '@urenatech/zpl-core'
          - '@urenatech/zpl-react'
          - '@urenatech/zpl-angular'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      # ng-packagr generates the Angular Package Format manifest in dist.
      - if: inputs.package == '@urenatech/zpl-angular'
        run: npm publish ./packages/angular/dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: inputs.package != '@urenatech/zpl-angular'
        run: npm publish --workspace "$PACKAGE"
        env:
          PACKAGE: ${{ inputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
