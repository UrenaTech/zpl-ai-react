name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs the typecheck, tests, and build before publishing.
      - run: npm publish --workspace @urenatech/zpl-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
